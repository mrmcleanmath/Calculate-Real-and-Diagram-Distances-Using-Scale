<script>
function formatNumber(value, decimals) {
if (!isFinite(value)) return String(value);
const decs = (typeof decimals === "number" && decimals >= 0) ? decimals : null;
if (decs !== null) value = Number(value.toFixed(decs));

const parts = String(value).split(".");
let intPart = parts[0];
const isNeg = intPart[0] === "-";
if (isNeg) intPart = intPart.slice(1);
intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
if (isNeg) intPart = "-" + intPart;

return (parts.length > 1) ? (intPart + "." + parts[1]) : intPart;
}

function parseUserNumber(str) {
if (str == null) return NaN;
let s = String(str).trim();
if (!s) return NaN;
s = s.replace(/\s+/g, "");
s = s.replace(",", ".");
return Number(s);
}

function approxEqual(a, b, tolAbs, tolRel) {
if (!isFinite(a) || !isFinite(b)) return false;
const diff = Math.abs(a - b);
const tolA = (typeof tolAbs === "number") ? tolAbs : 0.005;
const tolR = (typeof tolRel === "number") ? tolRel : 0.001;
if (diff <= tolA) return true;
const maxAB = Math.max(Math.abs(a), Math.abs(b));
if (maxAB === 0) return diff === 0;
return diff / maxAB <= tolR;
}

function getQueryParam(name) {
const params = new URLSearchParams(window.location.search);
return params.get(name);
}

// Scale formatting: NEVER round 2.5 to 3
function fmtScalePart(x) {
if (!isFinite(x)) return String(x);
if (Number.isInteger(x)) return String(x);
// show up to 2 decimals, strip trailing zeros
let s = x.toFixed(2);
s = s.replace(/\.?0+$/,"");
return s;
}

function formatScaleLine(a, b) {
return "Scale: " + fmtScalePart(a) + " : " + fmtScalePart(b);
}

// Convention:
// Scale a:b means diagram : real
function realFromDiagram(diagram, a, b) { return diagram * (b / a); }
function diagramFromReal(real, a, b) { return real * (a / b); }

// ---------- Problem generation ----------
function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function generateProblem(difficulty) {
if (difficulty === "random") {
const r = Math.random();
if (r < 0.25) difficulty = "easy";
else if (r < 0.65) difficulty = "medium";
else difficulty = "hard";
}

if (difficulty === "easy") return generateEasyProblem();
if (difficulty === "medium") return generateMediumProblem();
return generateHardProblem();
}

// Easy: same units, whole numbers, simple scale
// FIXED: enlargement and reduction always follow the same diagram:real convention
function generateEasyProblem() {
const types = ["diagramToReal", "realToDiagram"];
const type = randomChoice(types);
const unit = randomChoice(["cm", "mm"]);

const isReduction = Math.random() < 0.65;
let scaleNum, scaleDen;

if (isReduction) {
// reduction like 1:5 (diagram smaller)
scaleNum = 1;
scaleDen = randomChoice([2, 5, 10, 20, 50, 100, 200, 500, 1000]);
} else {
// enlargement like 5:1 (diagram bigger)
scaleNum = randomChoice([2, 3, 4, 5]);
scaleDen = 1;
}

let givenValue, answerValue;

if (type === "diagramToReal") {
// real = diagram * (den/num)
const k = randomInt(2, 20);
if (isReduction) {
// diagram k -> real k*den
givenValue = k;
answerValue = realFromDiagram(givenValue, scaleNum, scaleDen);
} else {
// choose diagram as multiple of scaleNum so real stays integer
givenValue = k * scaleNum;
answerValue = realFromDiagram(givenValue, scaleNum, scaleDen); // = k
}
} else {
// diagram = real * (num/den)
const k = randomInt(2, 20);
if (isReduction) {
// choose real as multiple of scaleDen so diagram stays integer
givenValue = k * scaleDen;
answerValue = diagramFromReal(givenValue, scaleNum, scaleDen); // = k
} else {
// enlargement: real k -> diagram k*scaleNum
givenValue = k;
answerValue = diagramFromReal(givenValue, scaleNum, scaleDen);
}
}

// Ensure integer (should already be)
givenValue = Math.round(givenValue);
answerValue = Math.round(answerValue);

const context = randomChoice(["a simple map", "a small diagram", "a scale drawing", "a picture"]);

let text, meta, typeLabel;
if (type === "diagramToReal") {
typeLabel = "Diagram → real distance (no unit conversion)";
text = "On " + context + ", the distance between two points is " +
formatNumber(givenValue, 0) + " " + unit + ". " +
"Use the scale to find the real distance.";
meta = "Give your answer as a whole number in " + unit + ".";
} else {
typeLabel = "Real → diagram distance (no unit conversion)";
text = "In real life, an object is " +
formatNumber(givenValue, 0) + " " + unit + " long. " +
"It is drawn using the scale shown. Find the length in the drawing.";
meta = "Give your answer as a whole number in " + unit + ".";
}

const scaleStr = formatScaleLine(scaleNum, scaleDen);

const explanation = buildStepsExplanation({
type,
context,
unitDiagram: unit,
unitReal: unit,
scaleNum,
scaleDen,
givenValue,
answerValue,
askUnit: unit
});

return {
difficulty: "easy",
type,
context,
unitDiagram: unit,
unitReal: unit,
scaleNum,
scaleDen,
givenValue,
answerValue,
answerUnit: unit,
questionTypeLabel: typeLabel,
questionText: text,
questionMeta: meta,
scaleLine: scaleStr,
explanationHtml: explanation,
decimals: 0
};
}

// Medium: mm<->cm, cm<->m, moderate scales, decimals possible
function generateMediumProblem() {
const types = ["diagramToReal", "realToDiagram"];
const type = randomChoice(types);
const variant = randomChoice(["map_cm_to_m", "real_mm_to_cm_blueprint", "photo_scale"]);
let scaleNum, scaleDen;
let unitDiagram, unitReal;
let givenValue, answerValue;
let context, typeLabel, text, meta;

if (variant === "map_cm_to_m") {
context = "a map";
scaleNum = 1;
scaleDen = randomChoice([500, 1000, 2000, 5000]);
unitDiagram = "cm";
unitReal = "m";

if (type === "diagramToReal") {
typeLabel = "Diagram → real distance (cm to m)";
const baseCm = randomChoice([1.6, 2.3, 3.2, 4.8, 5.5, 6.4]);
givenValue = baseCm;
const realCm = realFromDiagram(givenValue, scaleNum, scaleDen); // in cm
answerValue = realCm / 100; // to m
text = "A map has a scale of 1 : " + formatNumber(scaleDen, 0) +
". The distance between two places on the map is " +
formatNumber(givenValue, 1) + " cm. Find the real distance.";
meta = "Give your answer in meters (m).";
} else {
typeLabel = "Real → diagram distance (m to cm)";
const baseM = randomChoice([60, 120, 240, 350, 480, 520]);
givenValue = baseM;
const realCm = givenValue * 100;
answerValue = diagramFromReal(realCm, scaleNum, scaleDen); // to cm
text = "A map uses a scale of 1 : " + formatNumber(scaleDen, 0) +
". The real distance between two towns is " +
formatNumber(givenValue, 0) + " m. How far apart are they on the map?";
meta = "Give your answer in centimeters (cm).";
}
} else if (variant === "real_mm_to_cm_blueprint") {
context = "a technical drawing";
const enlargementScales = [[2,1],[3,1],[4,1],[5,1]];
const sc = randomChoice(enlargementScales);
scaleNum = sc[0];
scaleDen = sc[1];
unitDiagram = "cm";
unitReal = "mm";

if (type === "diagramToReal") {
typeLabel = "Diagram → real length (cm to mm)";
const baseCm = randomChoice([4, 5.5, 7.2, 8, 9.5, 10.4]);
givenValue = baseCm;
const realCm = realFromDiagram(givenValue, scaleNum, scaleDen); // cm
answerValue = realCm * 10; // mm
text = "A part is drawn in " + context + " using the scale " +
fmtScalePart(scaleNum) + " : " + fmtScalePart(scaleDen) +
". On the drawing, the part is " + formatNumber(givenValue, 1) +
" cm long. Find its real length.";
meta = "Give your answer in millimeters (mm).";
} else {
typeLabel = "Real → diagram length (mm to cm)";
const baseMm = randomChoice([36, 48, 72, 85, 96, 110]);
givenValue = baseMm;
const realCm = givenValue / 10;
answerValue = diagramFromReal(realCm, scaleNum, scaleDen); // cm
text = "A machine part is " + formatNumber(givenValue, 0) +
" mm long in real life. It is drawn in " + context +
" using a scale of " + fmtScalePart(scaleNum) +
" : " + fmtScalePart(scaleDen) + ". Find its length on the drawing.";
meta = "Give your answer in centimeters (cm).";
}
} else {
context = "an enlarged photograph";
const scales = [[5,2],[3,2],[4,3]];
const sc = randomChoice(scales);
scaleNum = sc[0];
scaleDen = sc[1];
unitDiagram = "cm";
unitReal = "cm";

if (type === "diagramToReal") {
typeLabel = "Diagram → real length (enlarged photo)";
const baseDiagram = randomChoice([8.4, 10.5, 12.6, 15.2]);
givenValue = baseDiagram;
answerValue = realFromDiagram(givenValue, scaleNum, scaleDen);
text = "An object appears in " + context + " using a scale of " +
fmtScalePart(scaleNum) + " : " + fmtScalePart(scaleDen) +
". On the photograph, it is " + formatNumber(givenValue, 1) +
" cm long. Find its real length.";
meta = "Give your answer in centimeters (cm). Decimals are allowed.";
} else {
typeLabel = "Real → diagram length (enlarged photo)";
const baseReal = randomChoice([4.2, 5.6, 6.8, 7.5]);
givenValue = baseReal;
answerValue = diagramFromReal(givenValue, scaleNum, scaleDen);
text = "An object is " + formatNumber(givenValue, 1) +
" cm long in real life. In " + context +
", it is shown using the scale " + fmtScalePart(scaleNum) +
" : " + fmtScalePart(scaleDen) +
". Find its length on the photograph.";
meta = "Give your answer in centimeters (cm). Decimals are allowed.";
}
}

const scaleStr = formatScaleLine(scaleNum, scaleDen);

const explanation = buildStepsExplanation({
type,
context,
unitDiagram,
unitReal,
scaleNum,
scaleDen,
givenValue,
answerValue,
askUnit: (type === "diagramToReal" ? unitReal : unitDiagram)
});

const decimals = (variant === "map_cm_to_m" ? 0 : 2);

return {
difficulty: "medium",
type,
context,
unitDiagram,
unitReal,
scaleNum,
scaleDen,
givenValue,
answerValue,
answerUnit: (type === "diagramToReal" ? unitReal : unitDiagram),
questionTypeLabel: typeLabel,
questionText: text,
questionMeta: meta,
scaleLine: scaleStr,
explanationHtml: explanation,
decimals
};
}

// Hard: big map scales, km, mixed conversions, decimals
function generateHardProblem() {
const types = ["diagramToReal", "realToDiagram"];
const type = randomChoice(types);
const variant = randomChoice(["map_cm_to_km", "blueprint_cm_mm", "drawing_m_to_cm"]);
let scaleNum, scaleDen;
let unitDiagram, unitReal;
let givenValue, answerValue;
let context, typeLabel, text, meta;

if (variant === "map_cm_to_km") {
context = "a detailed map";
scaleNum = 1;
scaleDen = randomChoice([20000, 25000, 50000, 100000]);
unitDiagram = "cm";
unitReal = "km";

if (type === "diagramToReal") {
typeLabel = "Diagram → real distance (cm to km)";
const baseCm = randomChoice([4.6, 5.2, 6.8, 7.3, 8.1]);
givenValue = baseCm;
const realCm = realFromDiagram(givenValue, scaleNum, scaleDen);
answerValue = realCm / 100000; // km
text = "A map uses a scale of 1 : " + formatNumber(scaleDen, 0) +
". The distance between two villages on the map is " +
formatNumber(givenValue, 1) + " cm. Find the real distance.";
meta = "Give your answer in kilometers (km). Decimals are allowed.";
} else {
typeLabel = "Real → diagram distance (km to cm)";
const baseKm = randomChoice([1.2, 2.4, 3.6, 4.5, 5.75]);
givenValue = baseKm;
const realCm = baseKm * 100000;
answerValue = diagramFromReal(realCm, scaleNum, scaleDen); // cm
text = "The real distance between two cities is " +
formatNumber(givenValue, 2) +
" km. A map uses a scale of 1 : " + formatNumber(scaleDen, 0) +
". How far apart are the cities on the map?";
meta = "Give your answer in centimeters (cm). Decimals are allowed.";
}
} else if (variant === "blueprint_cm_mm") {
context = "a building plan";
const sc = randomChoice([[3,50], [2,25], [1,20]]);
scaleNum = sc[0];
scaleDen = sc[1];
unitDiagram = "cm";
unitReal = "m";

if (type === "diagramToReal") {
typeLabel = "Diagram → real length (cm to m)";
const baseCm = randomChoice([12.5, 18.4, 22.6, 30.0]);
givenValue = baseCm;
const realCm = realFromDiagram(givenValue, scaleNum, scaleDen);
answerValue = realCm / 100;
text = "A wall is drawn in " + context + " using a scale of " +
fmtScalePart(scaleNum) + " : " + fmtScalePart(scaleDen) +
". On the drawing, the wall is " + formatNumber(givenValue, 1) +
" cm long. Find its real length.";
meta = "Give your answer in meters (m). Decimals are allowed.";
} else {
typeLabel = "Real → diagram length (m to cm)";
const baseM = randomChoice([3.2, 4.5, 5.8, 6.4, 7.25]);
givenValue = baseM;
const realCm = baseM * 100;
answerValue = diagramFromReal(realCm, scaleNum, scaleDen);
text = "A beam is " + formatNumber(givenValue, 2) +
" m long in real life. It is drawn on " + context +
" using a scale of " + fmtScalePart(scaleNum) +
" : " + fmtScalePart(scaleDen) + ". Find its length on the plan.";
meta = "Give your answer in centimeters (cm). Decimals are allowed.";
}
} else {
context = "a scale drawing";
scaleNum = 1;
scaleDen = 2.5;
unitDiagram = "cm";
unitReal = "m";

if (type === "diagramToReal") {
typeLabel = "Diagram → real length (cm to m, fractional scale)";
const baseDiagram = randomChoice([10.8, 15.5, 18.4, 22.0]);
givenValue = baseDiagram;
const realCm = realFromDiagram(givenValue, scaleNum, scaleDen);
answerValue = realCm / 100;
text = "A scale drawing is made using a scale of 1 : 2.5. " +
"On the drawing, a metal bar is " + formatNumber(givenValue, 1) +
" cm long. Find its real length.";
meta = "Give your answer in meters (m). Decimals are allowed.";
} else {
typeLabel = "Real → diagram length (m to cm, fractional scale)";
const baseM = randomChoice([1.8, 2.4, 3.6, 4.1]);
givenValue = baseM;
const realCm = baseM * 100;
answerValue = diagramFromReal(realCm, scaleNum, scaleDen);
text = "A metal bar is " + formatNumber(givenValue, 1) +
" m long in real life. It is drawn using a scale of 1 : 2.5. " +
"Find its length on the drawing.";
meta = "Give your answer in centimeters (cm). Decimals are allowed.";
}
}

// FIXED: never round 2.5 to 3
const scaleStr = formatScaleLine(scaleNum, scaleDen);

const explanation = buildStepsExplanation({
type,
context,
unitDiagram,
unitReal,
scaleNum,
scaleDen,
givenValue,
answerValue,
askUnit: (type === "diagramToReal" ? unitReal : unitDiagram)
});

return {
difficulty: "hard",
type,
context,
unitDiagram,
unitReal,
scaleNum,
scaleDen,
givenValue,
answerValue,
answerUnit: (type === "diagramToReal" ? unitReal : unitDiagram),
questionTypeLabel: typeLabel,
questionText: text,
questionMeta: meta,
scaleLine: scaleStr,
explanationHtml: explanation,
decimals: 2
};
}

function buildStepsExplanation(info) {
const {
type,
unitDiagram,
unitReal,
scaleNum,
scaleDen,
givenValue,
answerValue,
askUnit
} = info;

let html = "<strong>Steps:</strong><br>";
const scaleStr = fmtScalePart(scaleNum) + " : " + fmtScalePart(scaleDen);

html += "1. Use the scale " + scaleStr + " to relate the diagram and real lengths.<br>";

if (unitDiagram !== unitReal) {
html += "2. Convert units if needed so you can use the scale correctly.<br>";
}

if (type === "diagramToReal") {
html += "3. The given value is from the diagram: " +
formatNumber(givenValue, (Number.isInteger(givenValue)?0:2)) + " " + unitDiagram + ".<br>";
html += "4. Because the scale is (diagram : real) = " + scaleStr +
", multiply by (real/diagram) = " + fmtScalePart(scaleDen) + " / " + fmtScalePart(scaleNum) +
" to get the real length (in the same base unit).<br>";
} else {
html += "3. The given value is from real life: " +
formatNumber(givenValue, (Number.isInteger(givenValue)?0:2)) + " " + unitReal + ".<br>";
html += "4. Because the scale is (diagram : real) = " + scaleStr +
", multiply by (diagram/real) = " + fmtScalePart(scaleNum) + " / " + fmtScalePart(scaleDen) +
" to get the diagram length (in the same base unit).<br>";
}

html += "5. Finally, convert the result into the requested unit (" + askUnit + ") if needed.<br>";
html += "6. Answer: " + formatNumber(answerValue, 3) + " " + askUnit + ".";

return html;
}
let difficulty="easy",current=null,evaluated=false,correctCount=0,incorrectCount=0;

function parseAnswerStrict(v){
  if(v==null)return null;
  const s=String(v).trim().replace(/\u00A0/g," ").replace(/\s+/g,"").replace(",",".");
  if(!s||!/^-?\d+(?:\.\d+)?$/.test(s))return null;
  const n=Number(s);return Number.isFinite(n)?n:null;
}
function expectedDisplay(p){return formatNumber(p.answerValue,3)}
function answerIsCorrect(user,p){return Math.abs(user-p.answerValue)<=0.0005+1e-12}

function render(){
  current=generateProblem(difficulty);evaluated=false;
  document.getElementById("type").textContent=current.questionTypeLabel;
  document.getElementById("question").textContent=current.questionText;
  document.getElementById("scale").textContent=current.scaleLine;
  const needsRound=Math.abs(current.answerValue-Number(current.answerValue.toFixed(3)))>1e-12;
  document.getElementById("meta").textContent=current.questionMeta+(needsRound?" Round to 3 decimal places.":"");
  document.getElementById("unit").textContent=current.answerUnit;
  const a=document.getElementById("answer");a.value="";a.disabled=false;a.focus();
  document.getElementById("checkBtn").disabled=false;document.getElementById("nextBtn").disabled=true;
  document.getElementById("feedback").className="feedback";document.getElementById("feedback").textContent="Enter your answer.";
  document.getElementById("steps").className="steps";document.getElementById("steps").innerHTML="";
}
function check(){
  if(evaluated)return;
  const user=parseAnswerStrict(document.getElementById("answer").value);
  if(user===null){
    document.getElementById("feedback").className="feedback";
    document.getElementById("feedback").textContent="Enter a valid number. Decimal comma or point is accepted.";
    return;
  }
  const ok=answerIsCorrect(user,current);
  evaluated=true;
  document.getElementById("answer").disabled=true;
  document.getElementById("checkBtn").disabled=true;
  document.getElementById("nextBtn").disabled=false;
  if(ok){
    correctCount++;
    document.getElementById("correct").textContent=correctCount;
    document.getElementById("feedback").className="feedback ok";
    document.getElementById("feedback").textContent="Correct!";
  }else{
    incorrectCount++;
    document.getElementById("incorrect").textContent=incorrectCount;
    document.getElementById("feedback").className="feedback bad";
    document.getElementById("feedback").textContent=`Incorrect. Correct answer: ${expectedDisplay(current)} ${current.answerUnit}`;
    const s=document.getElementById("steps");
    s.innerHTML=current.explanationHtml;
    s.classList.add("show");
  }
}
function clearAnswer(){
  if(evaluated)return;
  document.getElementById("answer").value="";
  document.getElementById("answer").focus();
}

document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  difficulty=b.dataset.diff;
  render();
}));
document.getElementById("newBtn").addEventListener("click",render);
document.getElementById("checkBtn").addEventListener("click",check);
document.getElementById("nextBtn").addEventListener("click",render);
document.getElementById("clearBtn").addEventListener("click",clearAnswer);
document.getElementById("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();evaluated?render():check()}
  else if(e.key==="Escape"){e.preventDefault();clearAnswer()}
});

function showPractice(){
  document.getElementById("practiceTab").classList.add("active");
  document.getElementById("worksheetTab").classList.remove("active");
  document.getElementById("practiceCard").style.display="block";
  document.getElementById("worksheetCard").style.display="none";
}
function showWorksheet(){
  document.getElementById("worksheetTab").classList.add("active");
  document.getElementById("practiceTab").classList.remove("active");
  document.getElementById("practiceCard").style.display="none";
  document.getElementById("worksheetCard").style.display="block";
}
document.getElementById("practiceTab").addEventListener("click",showPractice);
document.getElementById("worksheetTab").addEventListener("click",showWorksheet);

function wsItem(p,i){
  const c=document.createElement("div");c.className="ws-item";
  const q=document.createElement("div");q.className="ws-q";q.textContent=`${i}. ${p.questionText}`;
  const sc=document.createElement("div");sc.className="ws-scale";sc.textContent=p.scaleLine;
  const meta=document.createElement("div");meta.style.color="var(--muted)";meta.style.fontSize="13px";meta.textContent=p.questionMeta;
  const a=document.createElement("div");a.className="ws-a";a.textContent=`Answer: ${expectedDisplay(p)} ${p.answerUnit}`;
  const b=document.createElement("button");b.type="button";b.className="no-print";b.textContent="Reveal";
  b.addEventListener("click",()=>{a.classList.toggle("show");b.textContent=a.classList.contains("show")?"Hide":"Reveal"});
  c.append(q,sc,meta,a,b);
  return c;
}
function generateWs(){
  const n=Number(document.getElementById("wsCount").value);
  const list=document.getElementById("wsList");list.innerHTML="";
  const used=new Set();let tries=0;
  while(list.children.length<n&&tries<n*100){
    const p=generateProblem(difficulty),key=p.questionText+"|"+p.scaleLine;
    if(!used.has(key)){used.add(key);list.appendChild(wsItem(p,list.children.length+1))}
    tries++;
  }
  const names={easy:"Foundation",medium:"Core",hard:"Challenge"};
  document.getElementById("wsMeta").textContent=`${names[difficulty]} • ${list.children.length} questions`;
  const empty=list.children.length===0;
  document.getElementById("revealAll").disabled=empty;
  document.getElementById("hideAll").disabled=empty;
  document.getElementById("printBtn").disabled=empty;
}
document.getElementById("wsGen").addEventListener("click",generateWs);
document.getElementById("revealAll").addEventListener("click",()=>document.querySelectorAll(".ws-a").forEach(x=>x.classList.add("show")));
document.getElementById("hideAll").addEventListener("click",()=>document.querySelectorAll(".ws-a").forEach(x=>x.classList.remove("show")));
document.getElementById("printBtn").addEventListener("click",()=>window.print());

window.__MMM_TEST__={generateProblem,generateEasyProblem,generateMediumProblem,generateHardProblem,realFromDiagram,diagramFromReal};
render();
</script>
